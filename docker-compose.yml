services:
  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes: [kafka_data:/bitnami/kafka]
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [es_data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: ENADE
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: ${LDAP_PASSWORD:-admin_dev_password_change_me}
      LDAP_TLS: "false"
    ports: ["389:389"]
    volumes: [ldap_data:/var/lib/ldap, ldap_config:/etc/ldap/slapd.d]

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports: ["8000:8000"]
    volumes: [.:/app, ./data:/app/data]
    depends_on:
      kafka: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}
      openldap: {condition: service_started}

  worker:
    build: .
    command: python -m app.worker.consumer
    env_file: .env
    volumes: [.:/app, ./data:/app/data]
    depends_on:
      kafka: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}

  frontend:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: [./frontend:/web]
    depends_on: [api]

  # KDC de laboratório. A integração SASL/GSSAPI deve ser configurada
  # com realm, principals, keytabs e JAAS antes de declarar RF22 atendido.
  kerberos:
    image: ghcr.io/zulhfreelancer/kerberos:latest
    profiles: ["security-lab"]
    ports: ["88:88/udp", "749:749"]

volumes:
  kafka_data:
  es_data:
  redis_data:
  ldap_data:
  ldap_config:
